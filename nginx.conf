server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Same cache rules as public/_headers.
    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated so a deploy is picked up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
