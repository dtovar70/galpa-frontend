<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <title>Corporación Galpa 2022 C.A. — Aires acondicionados, repuestos y asesoría</title>
        <meta
            name="description"
            content="Aires acondicionados residenciales y comerciales, repuestos y accesorios. 30 años de experiencia, asesoría técnica personalizada y equipos en stock o bajo pedido."
        />
        <meta name="theme-color" content="#0A0F0D" />

        <!-- Link previews (WhatsApp, Instagram, Facebook, X). -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="es_VE" />
        <meta property="og:site_name" content="Corporación Galpa 2022 C.A." />
        <meta
            property="og:title"
            content="Corporación Galpa 2022 C.A. — 30 años climatizando tus espacios"
        />
        <meta
            property="og:description"
            content="Aires acondicionados residenciales y comerciales, repuestos y accesorios con asesoría técnica personalizada."
        />
        <meta property="og:image" content="/img/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Logo de Corporación Galpa 2022 C.A." />
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="Corporación Galpa 2022 C.A. — 30 años climatizando tus espacios"
        />
        <meta
            name="twitter:description"
            content="Aires acondicionados residenciales y comerciales, repuestos y accesorios con asesoría técnica personalizada."
        />
        <meta name="twitter:image" content="/img/og-image.png" />

        <!--
          Fonts load without blocking the first paint: the system font shows right away and
          `display=swap` switches to the brand fonts once they arrive. Plus Jakarta Sans sets the
          whole interface; Space Grotesk the technical figures (BTU, prices, codes).
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
            onload="
                this.onload = null
                this.rel = 'stylesheet'
            "
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
            />
        </noscript>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
